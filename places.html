<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tourist Places</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .header {
            background: #12355b;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
        }

        .header p {
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .city {
            text-align: center;
            color: #12355b;
            margin-bottom: 30px;
        }

        .places {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 270px;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.10);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 45px;
            text-align: center;
        }

        .card h2 {
            color: #12355b;
            text-align: center;
        }

        .card p {
            color: #555;
            line-height: 1.5;
        }

        .back {
            display: block;
            width: 180px;
            margin: 40px auto;
            padding: 13px;
            text-align: center;
            background: #12355b;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>
        🏝️ TOURIST PLACES
    </h1>

    <p>
        Explore Places in {{ city }}
    </p>

</div>


<div class="container">


    <h2 class="city">
        📍 {{ city }}
    </h2>


    <div class="places">


        {% for place in places %}

        <div class="card">

            <div class="icon">
                📍
            </div>

            <h2>
                {{ place.name }}
            </h2>

            <p>
                <b>Location:</b>
                {{ place.location }}
            </p>

            <p>
                <b>Type:</b>
                {{ place.type }}
            </p>

        </div>

        {% endfor %}


        {% if not places %}

        <p>
            No tourist places available for this city.
        </p>

        {% endif %}


    </div>


    <a
        href="/"
        class="back"
    >
        ← BACK TO HOME
    </a>


</div>


</body>

</html>
