<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Guide</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .header {
            background: #12355b;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .city {
            text-align: center;
            color: #12355b;
            margin-bottom: 30px;
        }

        .foods {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 270px;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.10);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .food-icon {
            text-align: center;
            font-size: 48px;
        }

        .card h2 {
            text-align: center;
            color: #12355b;
        }

        .card p {
            color: #555;
            line-height: 1.6;
        }

        .price {
            color: #188038;
            font-weight: bold;
        }

        .back {
            display: block;
            width: 180px;
            margin: 40px auto;
            padding: 13px;
            text-align: center;
            background: #12355b;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>
        🍴 FOOD GUIDE
    </h1>

    <p>
        Explore Local Food in {{ city }}
    </p>

</div>


<div class="container">


    <h2 class="city">
        📍 {{ city }}
    </h2>


    <div class="foods">


        {% for food in foods %}

        <div class="card">

            <div class="food-icon">
                🍴
            </div>

            <h2>
                {{ food.name }}
            </h2>

            <p>
                <b>Type:</b>
                {{ food.type }}
            </p>

            <p class="price">
                💰 {{ food.price }}
            </p>

            <p>
                📍 {{ city }}
            </p>

        </div>

        {% endfor %}


        {% if not foods %}

        <p>
            No food information available.
        </p>

        {% endif %}


    </div>


    <a
        href="/"
        class="back"
    >
        ← BACK TO HOME
    </a>


</div>


</body>

</html>
